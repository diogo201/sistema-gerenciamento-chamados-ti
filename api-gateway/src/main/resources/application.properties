
# Nome da aplicacao
spring.application.name=api-gateway

# Porta do API Gateway
server.port=8080

# Endereco do Eureka Server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Registrar o Gateway no Eureka
eureka.client.register-with-eureka=true

# Buscar os microsservicos registrados
eureka.client.fetch-registry=true

# Rota para o microsservico de chamados
spring.cloud.gateway.server.webflux.routes[0].id=chamados-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://chamados-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/chamados,/chamados/**

# Configuracao de CORS para o frontend
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:5500,http://127.0.0.1:5500
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=*

# Permitir resposta CORS para requisicoes OPTIONS
spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true
